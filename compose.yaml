version: "3.8"

services:
  # ==========================================
  # 1. INFRASTRUCTURE (Databases)
  # ==========================================

  # Redis for Media Service Caching
  redis:
    image: redis:alpine
    container_name: empire_redis
    ports:
      - "6379:6379"
    networks:
      - empire_network

  # Postgres for Auth & Tracking Services
  postgres:
    image: postgres:15-alpine
    container_name: empire_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      # We create two DBs: one for auth, one for tracking
      # This init script trick creates multiple DBs on startup
      POSTGRES_DB: auth_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount a script to create the second DB (tracking_db)
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5432:5432" # Host:Container
    networks:
      - empire_network

  # ==========================================
  # 2. BACKEND MICROSERVICES
  # ==========================================

  # Node.js Media Service
  media-service:
    build: ./media-service # Path to your Node.js code
    container_name: media_service
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - REDIS_URL=redis://redis:6379 # Points to service name 'redis'
      # API Keys (Ideally load these from a .env file using ${VAR} syntax)
      - TMDB_API_KEY=${TMDB_API_KEY}
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID}
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET}
    depends_on:
      - redis
    networks:
      - empire_network

  # Spring Boot Auth Service
  auth-service:
    build: ./auth-service # Path to your Spring Boot code
    container_name: auth_service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=password
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      - postgres
    networks:
      - empire_network

  # Spring Boot Tracking Service
  tracking-service:
    build: ./tracking-service # Path to your Spring Boot code
    container_name: tracking_service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tracking_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=password
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      - postgres
      - auth-service
    networks:
      - empire_network

  # ==========================================
  # 3. FRONTEND (BFF)
  # ==========================================

  client:
    build: ./client # Path to your Next.js code
    container_name: nextjs_client
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Internal Docker URLs (Service to Service)
      - AUTH_SERVICE_URL=http://auth-service:8080
      - MEDIA_SERVICE_URL=http://media-service:4000
      - TRACKING_SERVICE_URL=http://tracking-service:8081
      # Security
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      - auth-service
      - media-service
      - tracking-service
    networks:
      - empire_network

# ==========================================
# 4. VOLUMES & NETWORKS
# ==========================================
volumes:
  postgres_data: # Persist DB data even if you delete containers

networks:
  empire_network:
    driver: bridge
