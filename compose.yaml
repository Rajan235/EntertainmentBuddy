# version: "3.8"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # --- Database ---
  postgres:
    image: postgres:15 # Pinned to a specific major version for stability.
    container_name: watchbuddy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- Java Auth Service ---
  auth-service:
    # This tells Docker Compose to use the image that was built by Jib.
    image: auth-service:latest
    container_name: watchbuddy-auth-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    env_file:
      - ./.env
    logging:
      <<: *default-logging

  # --- Observability Stack ---
  loki:
    image: grafana/loki:2.9.4
    container_name: watchbuddy-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.4
    container_name: watchbuddy-promtail
    volumes:
      # You will need to create these config files in your root directory.
      - ./promtail-config/promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.3
    container_name: watchbuddy-grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - tempo
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      # Mounts the datasources and dashboards for provisioning
      - ./grafana-config/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana-config/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.4.1
    container_name: watchbuddy-tempo
    restart: unless-stopped
    ports:
      - "3200:3200" # HTTP (query/api)
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP (optional if using HTTP)
    volumes:
      # You will need to create these config files in your root directory.
      - ./tempo-config/tempo-config.yaml:/etc/tempo.yaml
    command: ["-config.file=/etc/tempo.yaml"]

volumes:
  postgres_data: {}
