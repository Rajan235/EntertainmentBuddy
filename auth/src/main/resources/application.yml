server:
  port: 8080

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:5533}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Optional: for better error tracing
  sql:
    init:
      mode: always

# Logging level
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: auth-service

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4317}
      protocol: grpc
  resource:
    attributes:
      service.name: auth-service
      service.namespace: watchbuddy
      deployment.environment: dev
  logs:
    exporter: none # Disable OTLP log exporter
  traces:
    sampler:
      probability: 1.0 # 100% sampling for dev (reduce in prod)
